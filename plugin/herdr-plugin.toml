id = "zenderx.herdr-navigator"
name = "Herdr Navigator"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Pairs with Herdr Navigator for VS Code. Focuses the space you last used after herdr restarts, even after a crash or reboot, and adds an Open in VS Code action."
platforms = ["linux", "macos", "windows"]

[[events]]
on = "workspace.focused"
platforms = ["linux", "macos"]
command = ["sh", "scripts/record.sh"]

[[events]]
on = "workspace.focused"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/record.ps1"]

# herdr pushes no cwd change to plugins, so the return record is merged from a full pane list on each of these events.
[[events]]
on = "pane.focused"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "pane.focused"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "workspace.focused"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "workspace.focused"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "tab.focused"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "tab.focused"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "pane.created"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "pane.created"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "pane.moved"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "pane.moved"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "pane.closed"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "pane.closed"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "pane.exited"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "pane.exited"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "tab.closed"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "tab.closed"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[events]]
on = "workspace.closed"
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-record.sh"]

[[events]]
on = "workspace.closed"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-record.ps1"]

[[actions]]
id = "open-in-vscode"
title = "Open in VS Code"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "scripts/open-in-vscode.sh"]

[[actions]]
id = "open-in-vscode-windows"
title = "Open in VS Code"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-in-vscode.ps1"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/restore.sh"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/restore.ps1"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/discover.sh"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/discover.ps1"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/cwd-return.sh"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/cwd-return.ps1"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["sh", "scripts/discover.sh"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/discover.ps1"]

[[panes]]
id = "discovery"
title = "Herdr Navigator for VS Code"
placement = "popup"
width = 60
height = 8
platforms = ["linux", "macos"]
command = ["sh", "scripts/discovery-popup.sh"]

[[panes]]
id = "discovery-windows"
title = "Herdr Navigator for VS Code"
placement = "popup"
width = 60
height = 8
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/discovery-popup.ps1"]
